name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: fmt + clippy + test + web + packs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # ---------- Rust toolchain ----------
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-dev pkg-config cmake \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      # ---------- Web bundle first ----------
      # The Tauri crate's build script resolves `web/dist/**` as a resource glob,
      # so the frontend bundle must exist before any `cargo` command touches
      # app-tauri (clippy included) — otherwise the build script fails on a
      # missing glob instead of on real code.
      # pnpm version is pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm -C web install --frozen-lockfile

      - name: pnpm build
        run: pnpm -C web build

      # ---------- Rust side ----------
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (core crates)
        run: cargo test -p core-storage -p engine-dedup -p engine-exif -p pack-host -p svc-import

      - name: pnpm test
        run: pnpm -C web test

      # ---------- Packs ----------
      - name: pack conformance suite
        run: bash tools/pack-conformance/run_all.sh

      - name: pack lint (plugins/ecommerce)
        run: bash scripts/pack_lint.sh packs/plugins/ecommerce
